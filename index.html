<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Calculator Arvin</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="calculator">

        <div class="top">

            <h1>🧮 Calculator</h1>

            <button id="themeButton">
                🌙
            </button>

        </div>


        <!-- DISPLAY -->

        <div class="display-box">

            <div id="previous">
                0
            </div>

            <input
                type="text"
                id="display"
                value="0"
                readonly
            >

        </div>


        <!-- BUTTON -->

        <div class="buttons">

    <button class="clear" data-value="C">C</button>

    <button class="delete" data-value="DEL">
        DEL
    </button>

    <button class="operator" data-value="%">
        %
    </button>

    <button class="operator" data-value="/">
        ÷
    </button>


    <!-- SCIENTIFIC -->

    <button class="scientific" data-action="sqrt">
        √
    </button>

    <button class="scientific" data-action="square">
        x²
    </button>

    <button class="scientific" data-action="pi">
        π
    </button>

    <button class="scientific" data-action="log">
        log
    </button>


    <button class="scientific" data-action="sin">
        sin
    </button>

    <button class="scientific" data-action="cos">
        cos
    </button>

    <button class="scientific" data-action="tan">
        tan
    </button>

    <button class="operator" data-value="*">
        ×
    </button>


    <button data-value="7">7</button>
    <button data-value="8">8</button>
    <button data-value="9">9</button>

    <button class="operator" data-value="-">
        −
    </button>


    <button data-value="4">4</button>
    <button data-value="5">5</button>
    <button data-value="6">6</button>

    <button class="operator" data-value="+">
        +
    </button>


    <button data-value="1">1</button>
    <button data-value="2">2</button>
    <button data-value="3">3</button>

    <button class="equals">
        =
    </button>


    <button class="zero" data-value="0">
        0
    </button>

    <button data-value=".">
        .
    </button>

        </div>


        <!-- HISTORY -->

        <div class="history">

            <div class="history-title">
                <span>📜 Riwayat</span>

                <button id="clearHistory">
                    Hapus
                </button>
            </div>

            <div id="historyList">
                Belum ada perhitungan
            </div>

        </div>


        <a
            href="../index.html"
            class="back">
            ← Kembali ke Portfolio
        </a>

    </div>


    <script src="script.js"></script>

</body>

</html>
